name: FlakeGuard Scan (Reusable Workflow)

on:
  workflow_call:
    inputs:
      repo_path:
        description: "Path to repository target"
        required: false
        default: "."
        type: string
      n_runs:
        description: "Number of shuffled runs in perturbation matrix"
        required: false
        default: 3
        type: number
    secrets:
      LLM_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  flakeguard-scan:
    name: FlakeGuard Perturbation Scan & Triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & FlakeGuard
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute FlakeGuard Matrix Scan
        run: |
          flakeguard scan "${{ inputs.repo_path }}" --shuffled-n ${{ inputs.n_runs }}

      - name: Upload Single-Source-of-Truth Event Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flakeguard-event-log
          path: data/events/*.jsonl
          if-no-files-found: warn

      - name: Post or Update Sticky CI Triage Comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
        run: |
          python scripts/post_triage_comment.py


name: post-merge-verify

on:
  pull_request:
    types: [closed]
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: post-merge-${{ github.ref }}-${{ github.event.pull_request.number || 'push' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  post-merge-scan:
    # Only run on push or when PR is closed AND merged
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run verification scan
        id: scan
        continue-on-error: true
        run: |
          mkdir -p out
          flakeguard scan . --shuffled-n 3 --output-artifacts out

      - name: Report post-merge honest verdict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          python scripts/report_post_merge.py out

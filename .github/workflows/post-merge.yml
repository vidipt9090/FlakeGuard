name: post-merge-verify

on:
  pull_request:
    types: [closed]
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: post-merge-${{ github.ref }}-${{ github.event.pull_request.number || 'push' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  post-merge-scan:
    # Only run on push or when PR is closed AND merged
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run verification scan
        id: scan
        run: |
          mkdir -p out
          flakeguard scan . --shuffled-n 3 --output-artifacts out || true

      - name: Report post-merge honest verdict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, os, urllib.request

          artifacts_path = 'out/findings.json'
          flaky_found = False
          if os.path.exists(artifacts_path):
              try:
                  findings = json.load(open(artifacts_path))
                  flaky_found = any(f.get('verdict') == 'flaky' for f in findings)
              except Exception:
                  pass

          n_runs = 3
          events_path = 'out/events.jsonl'
          if os.path.exists(events_path):
              try:
                  with open(events_path, 'r', encoding='utf-8') as ef:
                      for line in ef:
                          if '\"total_slices\"' in line:
                              d = json.loads(line)
                              n_runs = d.get('data', {}).get('total_slices', n_runs)
                              break
              except Exception:
                  pass

          if not flaky_found:
              msg = f'### 🛡️ FlakeGuard Post-Merge Verification\n\n✅ **No evidence of flakiness in {n_runs} runs after this change**'
          else:
              msg = f'### 🛡️ FlakeGuard Post-Merge Verification\n\n⚠️ Flakiness detected after merge in {n_runs} runs.'

          print(msg)
          event_path = os.environ.get('GITHUB_EVENT_PATH')
          if event_path and os.path.exists(event_path):
              event = json.load(open(event_path))
              pr = event.get('pull_request')
              if pr and pr.get('comments_url'):
                  token = os.environ.get('GITHUB_TOKEN')
                  req = urllib.request.Request(
                      pr['comments_url'],
                      data=json.dumps({'body': msg}).encode('utf-8'),
                      headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json', 'User-Agent': 'flakeguard-bot'},
                      method='POST'
                  )
                  try:
                      urllib.request.urlopen(req)
                      print('Posted honest verdict to merged PR.')
                  except Exception as e:
                      print('Could not post comment:', e)
          "

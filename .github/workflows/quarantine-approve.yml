name: quarantine-approve

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

# Concurrency group per PR so multiple rapid requests don't collide
concurrency:
  group: quarantine-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quarantine:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'approve-quarantine') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       (startsWith(github.event.comment.body, '/quarantine') || startsWith(github.event.comment.body, '/approve-quarantine')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.event.issue.pull_request != null && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update quarantine.json
        id: update-db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/approve_quarantine.py

      - name: Commit and push quarantine update to PR head branch
        if: steps.update-db.outputs.added_count != '0' && steps.update-db.outputs.added_count != ''
        run: |
          git config user.name "flakeguard-bot"
          git config user.email "flakeguard-bot@users.noreply.github.com"
          git add quarantine.json
          git commit -m "chore(quarantine): quarantine tests from PR #${{ github.event.pull_request.number || github.event.issue.number }} [skip ci]"
          git push

name: triage

on:
  pull_request:
    branches: [develop, main]

# Concurrency group per PR so superseded commits cancel earlier in-flight triage
concurrency:
  group: triage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-synthetic:
    name: run-synthetic-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run synthetic tests
        run: |
          mkdir -p out
          # Record test start/failure timestamps and generate JUnit XML
          python -c "import json, datetime; json.dump({'test_started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}, open('out/timestamps.json', 'w'))"
          pytest synthetic -q --junitxml=out/junit-synthetic.xml || true
          python -c "import json, datetime, os; data = json.load(open('out/timestamps.json')) if os.path.exists('out/timestamps.json') else {}; data['test_failed_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat(); json.dump(data, open('out/timestamps.json', 'w'))"
      - name: Check if synthetic tests failed
        id: check-failure
        run: |
          python -c "import xml.etree.ElementTree as ET, sys; tree = ET.parse('out/junit-synthetic.xml'); root = tree.getroot(); fails = sum(1 for tc in root.iter('testcase') if tc.find('failure') is not None or tc.find('error') is not None); sys.exit(1 if fails > 0 else 0)"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-test-results
          path: out/
          retention-days: 14

  triage-comment:
    name: post-triage-comment
    needs: [test-synthetic]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: synthetic-test-results
          path: out/
      - name: Post or update triage bot comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/post_triage_comment.py out/junit-synthetic.xml out/timestamps.json

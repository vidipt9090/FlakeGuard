name: FlakeGuard CI Scan

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      n_runs:
        description: "Number of shuffled perturbation runs"
        required: false
        default: 3
        type: number
      flakeguard_ref:
        description: "FlakeGuard branch or tag to invoke (default: main)"
        required: false
        default: "main"
        type: string

concurrency:
  group: flakeguard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-flakeguard-scan:
    name: Run FlakeGuard Reusable Scan
    uses: vidipt9090/FlakeGuard/.github/workflows/scan.yml@main
    with:
      repo_url: ${{ github.repository }}
      n_runs: ${{ inputs.n_runs || 3 }}
      flakeguard_ref: ${{ inputs.flakeguard_ref || 'main' }}
    secrets: inherit

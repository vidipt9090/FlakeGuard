[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flakeguard"
version = "0.1.0"
description = "Detect and triage flaky tests using LLM-assisted analysis"
dependencies = [
    "pydantic",
    "ollama",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-randomly",
    "pytest-repeat",
    "ruff",
    "pydantic",
    "ollama",
    "freezegun",
    "pandas",
    "pyarrow",
    "jedi",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flakeguard*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E702"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/data holds sample projects that the navigator parses. They look like
# tests but must never be collected as ours.
norecursedirs = ["tests/data"]
